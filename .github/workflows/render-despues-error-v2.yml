name: Render Después del error v2 audio

on:
  push:
    branches:
      - render-despues-error-v2
    paths:
      - "render_despues_error_v2.py"
      - ".github/workflows/render-despues-error-v2.yml"
  pull_request:
    branches:
      - main
    paths:
      - "render_despues_error_v2.py"
      - ".github/workflows/render-despues-error-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install edge-tts pydub

      - name: Render voice and pauses
        run: python render_despues_error_v2.py

      - name: Upload finished audio
        uses: actions/upload-artifact@v4
        with:
          name: despues-del-error-v2-audio
          path: |
            output_despues_error_v2/Despues_del_error_volver_a_la_accion_relevante_v2.mp3
            output_despues_error_v2/Despues_del_error_v2_voz_limpia.wav
            output_despues_error_v2/render_metadata.json
          if-no-files-found: error
          retention-days: 7
