name: Render Lo que sí está audio

on:
  push:
    branches:
      - render-lo-que-si-esta
    paths:
      - "render_lo_que_si_esta.py"
      - ".github/workflows/render-lo-que-si-esta.yml"
  pull_request:
    branches:
      - main
    paths:
      - "render_lo_que_si_esta.py"
      - ".github/workflows/render-lo-que-si-esta.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install edge-tts pydub

      - name: Render voice and pauses
        run: python render_lo_que_si_esta.py

      - name: Upload finished audio
        uses: actions/upload-artifact@v4
        with:
          name: lo-que-si-esta-audio
          path: |
            output_lo_que_si_esta/Lo_que_si_esta_comenzar_el_dia_desde_la_abundancia.mp3
            output_lo_que_si_esta/Lo_que_si_esta_voz_limpia.wav
            output_lo_que_si_esta/render_metadata.json
          if-no-files-found: error
          retention-days: 7
